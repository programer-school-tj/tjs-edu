name: TJS Edu build
on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tjs_edu
          POSTGRES_USER: tjsedu
          POSTGRES_PASSWORD: tjs-edu-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tjsedu -d tjs_edu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tjsedu:tjs-edu-ci-password@localhost:5432/tjs_edu
      SESSION_SECRET: tjs-edu-ci-session-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Smoke test API and PostgreSQL connection
        run: |
          npm run start:api > /tmp/tjs-edu-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tjs-edu-api.log
          echo "TJS Edu API did not become healthy."
          exit 1
      - name: Unit tests (finance rules and templates)
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Validate Docker production image
        run: docker build -t tjs-edu:ci .
      - name: Upload editable source archive
        uses: actions/upload-artifact@v6
        with:
          name: tjs-edu-source
          path: |
            .
            !node_modules/**
            !.git/**
            !dist/**
            !coverage/**
            !.env
            !.env.*
            !tjs-edu-source.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: tjs-edu-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
