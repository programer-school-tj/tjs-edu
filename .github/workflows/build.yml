name: TJS Edu build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Package source code
        run: zip -r tjs-edu-source.zip . -x 'node_modules/*' '.git/*' 'dist/*' '.env' '.env.*' 'coverage/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: tjs-edu-source
          path: tjs-edu-source.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: tjs-edu-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
