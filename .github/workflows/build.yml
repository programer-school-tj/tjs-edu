name: TJS Edu build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Validate Docker production image
        run: docker build -t tjs-edu:ci .
      - name: Upload editable source archive
        uses: actions/upload-artifact@v4
        with:
          name: tjs-edu-source
          path: |
            .
            !node_modules/**
            !.git/**
            !dist/**
            !coverage/**
            !.env
            !.env.*
            !tjs-edu-source.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: tjs-edu-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
