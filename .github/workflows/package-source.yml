name: Package TJS Edu ZIP

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/production-readiness-phase-1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Create source ZIP
        run: |
          zip -r TJS-Edu-source.zip . \
            -x './.git/*' \
               './node_modules/*' \
               './.env' \
               './.env.*' \
               './TJS-Edu-source.zip'

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TJS-Edu-source
          path: TJS-Edu-source.zip
          if-no-files-found: error
          retention-days: 14
