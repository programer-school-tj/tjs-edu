services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tjs_edu
      POSTGRES_USER: tjsedu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tjs_edu_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tjsedu -d tjs_edu"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tjsedu:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tjs_edu
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      API_PORT: 3001
      NODE_ENV: production
    ports:
      - "127.0.0.1:8080:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  tjs_edu_db:
